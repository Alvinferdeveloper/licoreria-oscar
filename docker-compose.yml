services:
  postgres:
    image: postgres:15-alpine
    container_name: licoreria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licoreria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licoreria_dev}
      POSTGRES_DB: ${POSTGRES_DB:-licoreria_db}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-licoreria} -d $${POSTGRES_DB:-licoreria_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # api y web solo se levantan con el perfil "full":
  #   docker compose --profile full up -d --build
  # Durante el desarrollo se corren local con `npm run dev:api` / `npm run dev:web`.
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: licoreria-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-licoreria}:${POSTGRES_PASSWORD:-licoreria_dev}@postgres:5432/${POSTGRES_DB:-licoreria_db}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-docker-dev-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-docker-dev-refresh-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BACKUP_DIR: /app/backups
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@licoreria.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123*}
      TZ: UTC
    volumes:
      - backups_data:/app/backups
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/docs-json').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: licoreria-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["full"]

volumes:
  postgres_data:
  backups_data:
